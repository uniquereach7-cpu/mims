<header class="site-header" [ngClass]="{ 'is-scrolled': scrolled() }">
  <div class="container container--wide">
    <div class="bar">
      <a class="brand" routerLink="/" aria-label="MIMS Hospital — home">
        <img src="assets/images/logo.png" alt="MIMS Hospital, Maharajah's Institute of Medical Sciences" />
      </a>

      <nav class="nav" [ngClass]="{ 'is-open': menuOpen() }" aria-label="Main">
        <ul class="nav__list">
          @for (item of nav; track item.label) {
            <li class="nav__item" [class.has-children]="item.children?.length">
              @if (item.children?.length) {
                <button
                  type="button"
                  class="nav__link nav__toggle"
                  [attr.aria-expanded]="openSubmenu() === item.label"
                  (click)="toggleSubmenu(item.label)"
                >
                  {{ item.label }}
                  <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
                    <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" />
                  </svg>
                </button>
                <ul class="submenu" [class.is-open]="openSubmenu() === item.label">
                  @for (child of item.children; track child.path) {
                    <li><a [routerLink]="child.path" routerLinkActive="is-active">{{ child.label }}</a></li>
                  }
                </ul>
              } @else {
                <a
                  class="nav__link"
                  [routerLink]="item.path"
                  routerLinkActive="is-active"
                  [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                >{{ item.label }}</a>
              }
            </li>
          }
        </ul>

        <div class="nav__mobile-cta">
          <a class="btn btn--blue" routerLink="/book-appointment">
            Book Appointment
            <span class="btn__arrow" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 12 12">
                <path d="M2 10L10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </span>
          </a>
          <a class="nav__phone" [href]="site.phoneHref">24×7 Emergency · {{ site.phone }}</a>
        </div>
      </nav>

      <a class="btn btn--blue book-cta" routerLink="/book-appointment">
        Book Appointment
        <span class="btn__arrow" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 12 12">
            <path d="M2 10L10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </span>
      </a>

      <button
        type="button"
        class="burger"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
