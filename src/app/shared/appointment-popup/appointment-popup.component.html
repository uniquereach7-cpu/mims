<dialog #dialog aria-labelledby="appointment-popup-title" aria-describedby="appointment-popup-description"
  (cancel)="cancel($event)" (click)="closeOnBackdrop($event)">
  <div class="appointment-popup">
    <button class="appointment-popup__close" type="button" aria-label="Close appointment invitation" (click)="close()">×</button>
    <span class="appointment-popup__icon"><app-icon name="stethoscope" [size]="32" /></span>
    <span class="appointment-popup__eyebrow">MIMS Hospital · Here for you</span>
    <h2 id="appointment-popup-title">Your health.<br /><span>Our priority.</span></h2>
    <p id="appointment-popup-description">Book an appointment with our specialists. Our team will help you find the right care and confirm availability.</p>
    <div class="appointment-popup__actions">
      <a class="btn btn--blue" routerLink="/book-appointment" (click)="close()">Book an Appointment <span aria-hidden="true">↗</span></a>
      <button class="appointment-popup__browse" type="button" (click)="close()">Continue browsing</button>
    </div>
    <p class="appointment-popup__help">Prefer to call? <a [href]="site.phoneHref">{{ site.phone }}</a></p>
  </div>
</dialog>
